            animation: spin 2s linear infinite;

            from { transform: rotate(0deg); }

<body class="flex justify-center items-center min-h-screen">
<!-- Main Panel Container -->
<div class="w-panel-width h-[600px] relative overflow-hidden bg-[#F3E3D0] shadow-[-4px_0_20px_rgba(0,0,0,0.10)] flex flex-col font-body-regular text-on-surface">

<div class="absolute inset-0 bg-[#F3E3D0]/90 z-10 flex flex-col px-lg pt-2xl pb-lg">
<div class="flex-1 flex flex-col justify-center gap-xl">
<!-- Mini Business Card (Collapsed) -->
<div class="bg-white-surface border border-muted-taupe rounded-md p-md shadow-sm">
<div class="flex items-center gap-md">
<div class="w-10 h-10 bg-surface-container rounded-DEFAULT flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container fill" data-icon="storefront">storefront</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-xs">Kopi Janji Jiwa</h3>
<p class="font-body-small text-body-small text-text-muted">Cafe • Jakarta</p>
</div>
</div>
</div>
<!-- Progress Section -->
<div class="flex flex-col gap-lg mt-md">
<h2 class="font-headline-md text-headline-md text-on-surface text-center">Memvalidasi bisnis...</h2>
<!-- Progress List -->
<div class="flex flex-col gap-md pl-sm">
<!-- Layer 1: Complete -->
<div class="flex items-center gap-md">
<div class="w-6 h-6 rounded-full bg-success-green flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[14px] text-white-surface font-bold" data-icon="check">check</span>
</div>
<span class="font-body-regular text-body-regular text-on-surface">Layer 1 — Cek field website di Maps</span>
</div>
<!-- Layer 2: In Progress -->
<div class="flex items-center gap-md">
<div class="w-6 h-6 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container spin-slow" data-icon="progress_activity">progress_activity</span>
</div>
<span class="font-body-regular text-body-regular text-on-surface font-medium">Layer 2 — Membuka Instagram...</span>
</div>
<!-- Layer 3: Pending -->
<div class="flex items-center gap-md">
<div class="w-6 h-6 rounded-full border-2 border-muted-taupe flex items-center justify-center shrink-0"></div>
<span class="font-body-regular text-body-regular text-text-muted">Layer 3 — Google Search</span>
</div>
</div>

<div class="flex flex-col gap-xs mt-sm">
<div class="w-full h-[6px] bg-muted-taupe rounded-[3px] overflow-hidden">
<div class="h-full bg-primary-container rounded-[3px] w-[65%] transition-all duration-500 ease-out"></div>
</div>
<div class="flex justify-end">
<span class="font-caption text-caption text-text-muted">~8 detik tersisa</span>
</div>
</div>
</div>
</div>

<button class="font-caption text-caption text-text-muted underline hover:text-on-surface transition-colors">

                </button>
